name: Build and release fidoic.xpi

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the mocked test suite
        run: |
          npm install
          npm test
      - name: Check the tag matches manifest.json
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./manifest.json').version")"
          if [ "$want" != "$have" ]; then echo "Tag $GITHUB_REF_NAME but manifest.json says $have"; exit 1; fi
      - name: Build the xpi
        run: zip -X fidoic.xpi manifest.json bootstrap.js icon.svg
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: fidoic.xpi
          generate_release_notes: true
